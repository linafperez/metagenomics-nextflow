name: sratools_acquire
description: Acquire and validate one eligible SRA run as a paired gzip FASTQ task.
keywords:
  - sra
  - fastq
  - metagenomics
tools:
  - sra-tools:
      description: NCBI SRA acquisition, validation, and FASTQ conversion
      homepage: https://github.com/ncbi/sra-tools
      licence: PUBLIC-DOMAIN
  - pigz:
      description: Parallel gzip compression and CRC validation
      homepage: https://zlib.net/pigz/
      licence: ZLIB
input:
  - meta:
      type: map
      description: BioSample identity, group, run list, project, and input metadata
  - run_accession:
      type: value
      description: One eligible run belonging to this BioSample
  - pair_validator:
      type: file
      description: Streaming AWK validation of paired FASTQ structure and read IDs
output:
  - reads:
      type: file
      description: Metadata, run accession, and validated gzip mate pair
      pattern: '*_R*.fastq.gz'
  - log:
      type: file
      description: Acquisition and validation log
      pattern: '*.sra.log'
  - versions:
      type: value
      description: Process, tool, and version tuple
