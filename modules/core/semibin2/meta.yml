name: semibin2
description: Reconstruct metagenome-assembled genomes with self-supervised contig binning
keywords:
  - binning
  - metagenomics
  - MAG
tools:
  - semibin:
      description: Self-supervised metagenomic binning with SemiBin2
      homepage: https://github.com/BigDataBiology/SemiBin
      documentation: https://semibin.readthedocs.io/en/v1.5.0/
      licence: [MIT]
input:
  - meta:
      type: map
      description: Assembly branch metadata
  - contigs:
      type: file
      description: Coassembly contigs in FASTA format
  - bams:
      type: file
      description: Reference-sorted sample BAM files
output:
  - bins:
      type: directory
      description: Standardized uncompressed SemiBin2 FASTA bins
      pattern: '*.bins'
  - contigs2bin:
      type: file
      description: Headerless contig-to-bin mapping table for DAS Tool
      pattern: '*.contigs2bin.tsv'
  - native_outputs:
      type: directory
      description: Native SemiBin2 output directory
      pattern: '*.semibin2'
  - log:
      type: file
      description: SemiBin2 runtime log
      pattern: '*.semibin2.log'
  - versions:
      type: value
      description: Process, tool, and software version tuple
